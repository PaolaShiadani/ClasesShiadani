<div class="flex flex-col justify-center gap-4">

  <div class="overflow-auto" id="scrollableDiv2">
    @for (stori of successStories?.stories; track $index) {
    @if(isIndexVisible($index,indexPage,5)){
    <mat-card appearance="outlined">
      <div class="container-general">
        <mat-card-content><span class="text-lg">
            {{ stori.titule }}
          </span></mat-card-content>
        @if (stori.urlVideo?.length) {
        <div class="video-general p-2">
          @if (mobile) {
          <div class="video-container w-full">
            <iframe [src]="stori.urlRes" title="Nuvole Bianche - Ludovico Einaudi (Paola Shiadani)"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen></iframe>
          </div>

          } @else {
          <div>
            <iframe [width]="width" [height]="height" [src]="stori.urlRes"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen></iframe>
          </div>
          }
        </div>
        } @else {
        <div>
          <img [src]="stori.urlImg" class="h-[250px] md:h-[400px] m-auto" alt="" />
        </div>
        }

        <mat-card-content>
          <p class="text-sm">
            {{ stori.textBody }}
          </p>
        </mat-card-content>
      </div>

    </mat-card>
    }
    }
  </div>


  <mat-paginator class="mx-4" [length]="successStories?.stories?.length" [pageSize]="5"
    (page)="newIndex($event.pageIndex)">
    >
  </mat-paginator>


</div>
