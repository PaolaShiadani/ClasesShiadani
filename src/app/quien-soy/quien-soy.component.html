<div>
  <div class="container-general flex flex-col justify-center gap-4 py-4">
    <mat-card-content class="">
      <span class="text-lg text-center items-center flex justify-center">
        {{ profileData?.titule }}
      </span>
    </mat-card-content>

    @if (profileData && profileData.urlProfileImg) {
      <img
        class="h-[200px] md:h-[500px] object-cover p-2"
        mat-card-image
        [src]="profileData.urlProfileImg"
        alt="Photo of a Shiba Inu"
      />

      <mat-card-content>
        <p class="text-sm" style="white-space: pre-line">
          {{ profileData.textBody }}
        </p>
      </mat-card-content>
    }

    <div
      class="social-media gap-1 flex flex-col items-center pt-2 border-t-2 border-t-[#5f021a] mx-4"
    >
      <div>Contáctame</div>
      <div
        class="items-center py-2.5 rounded-lg w-full flex justify-center flex-wrap gap-4"
      >
        <a
          class="!bg-none"
          extended
          [href]="
            'https://wa.me/' +
            profileData?.phone +
            '?text=' +
            profileData?.whatsappMessage
          "
          target="_blank"
        >
          <img class="!w-[24px]" src="../../assets/icons/whatsapp.svg" alt="" />
        </a>
        <a class="!bg-none" extended [href]="profileData?.urlSelection" target="_blank">
          <img class="!w-[29px]" src="../../assets/icons/educación.svg" alt="" />
        </a>

        <a class="!bg-none" [href]="profileData?.urlInstamgram" target="_blank" extended>
          <img class="!w-[22px]" src="../../assets/icons/instragram.svg" alt="" />
        </a>

        <a class="!bg-none" [href]="profileData?.urlYoutube" target="_blank" extended>
          <img class="!w-[26px]" src="../../assets/icons/youtube.svg" alt="" />
        </a>

        <a
          class="!bg-none"
          href="mailto:paola.shiadani.pianista@gmail.com"
          target="_blank"
        >
          <img class="!w-[24.5px]" src="../../assets/icons/gmail.svg" alt="Gmail Icon" />
        </a>

        <a class="!bg-none" [href]="profileData?.urlTokTok" target="_blank" extended>
          <img class="!w-[24px]" src="../../assets/icons/tiktok.svg" alt="" />
        </a>

        <a class="!bg-none" [href]="profileData?.urlFacebook" target="_blank" extended>
          <img class="!w-[24px]" src="../../assets/icons/facebook.svg" alt="" />
        </a>
      </div>
    </div>
  </div>
</div>
