<div class="background-general">
  <div [class.margin-top]="mobile" class="mb-4">
    <div class="h-[60px]">
      <div class="py-6 px-8 h-[601x] flex justify-between bg-[#5f021a] items-center">
        <h1 class="relative z-10 text-white lg:text-4xl md:text-lg text-3lg">
          Clases de Piano con Paola Shiadani
        </h1>
        <p class="text-end text-xs">vB-1.4.1</p>
      </div>
    </div>

    <mat-tab-group (selectedIndexChange)="onTabChange($event)" color="primary">
      <mat-tab [label]="profileData?.ModulName ?? ''">
        <app-quien-soy [profileData]="profileData"></app-quien-soy>
      </mat-tab>
      <mat-tab [label]="pianoLessons?.moduleName ?? ''">
        <app-clases-piano
          [pianoLessons]="pianoLessons"
          [profileData]="profileData"
        ></app-clases-piano>
      </mat-tab>
      <mat-tab [label]="pianoEvents?.moduleName ?? ''">
        @if (pianoEvents) {
          <app-events
            [eventProfile]="pianoEvents"
            [profileData]="profileData"
          ></app-events>
        }
      </mat-tab>
      <mat-tab [label]="successStories?.moduleName ?? ''">
        <app-testimonios [successStories]="successStories"></app-testimonios>
      </mat-tab>
      <mat-tab [label]="promotional?.moduleName ?? ''">
        <app-promocionales [promotional]="promotional"></app-promocionales>
      </mat-tab>
    </mat-tab-group>
  </div>
</div>
